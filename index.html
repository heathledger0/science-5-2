<!doctype html>

<head>

<meta name="description" content="초등 과학 단원 도입 시간에 쓸 수 있는 핵심 개념 탐색 게임 모음. 교과서 내용을 올리면 핵심 개념 후보를 자동으로 뽑아주고, 교사가 최종 선택합니다." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%AC%3C/text%3E%3C/svg%3E" />

<header class="app-header">
  <a class="brand" href="#/">🔬 단원 열기</a>

  <button id="fontSizeToggle" class="ghost-btn" type="button" title="화면 글자 크게/작게 (교실 화면용)">Aa 크게</button>
